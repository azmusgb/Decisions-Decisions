[[redirects]]
  from = "/round2"
  to = "/archive.html"
  status = 302
[[redirects]]
  from = "/v4"
  to = "/archive.html"
  status = 302
[[redirects]]
  from = "/v3"
  to = "/archive.html"
  status = 302
[[redirects]]
  from = "/v2"
  to = "/archive.html"
  status = 302
[[redirects]]
  from = "/v1"
  to = "/archive.html"
  status = 302
[[redirects]]
