# Active shell and CSS are intentionally no-cache while the prototype is iterating.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
[[headers]]
  for = "/home.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
[[headers]]
  for = "/play.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/demo-access.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/diagnostics.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/analysis.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/feedback.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/site.css"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
[[headers]]
  for = "/play.css"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
[[headers]]
  for = "/site-nav.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
[[headers]]
  for = "/public-demo.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
[[headers]]
  for = "/demo-access.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
[[headers]]
  for = "/diagnostics.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
[[headers]]
  for = "/analysis.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
[[headers]]
  for = "/playtest-enhancements.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
[[headers]]
  for = "/play-runtime.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
[[headers]]
  for = "/play.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Historical/development surfaces stay out of search indexes.
[[headers]]
  for = "/archive.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/creative-direction-*.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/index.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/thanks.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Retain future-facing workstream pages by direct URL, but keep them out of
# public search until their content is current and appropriate to expose.
[[headers]]
  for = "/launch.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/press.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/partners.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/retail.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/manufacturing.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin"
