[build]
  publish = "."

[[redirects]]
  from = "/"
  to = "/creative-direction-v3.html"
  status = 200

[[redirects]]
  from = "/v3"
  to = "/creative-direction-v3.html"
  status = 200

[[redirects]]
  from = "/v2"
  to = "/creative-direction-v2.html"
  status = 200

[[redirects]]
  from = "/v1"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/thank-you"
  to = "/thank-you-v3.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
