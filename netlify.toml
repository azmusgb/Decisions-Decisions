[build]
  publish = "."

[[redirects]]
  from = "/"
  to = "/play.html"
  status = 200

[[redirects]]
  from = "/play"
  to = "/play.html"
  status = 200

# Preserve the creative-direction questionnaire and prior review URLs.
[[redirects]]
  from = "/survey"
  to = "/creative-direction-round2.html"
  status = 200

[[redirects]]
  from = "/round2"
  to = "/creative-direction-round2.html"
  status = 200

[[redirects]]
  from = "/v4"
  to = "/creative-direction-round2.html"
  status = 200

[[redirects]]
  from = "/v3"
  to = "/creative-direction-v3.html"
  status = 200

[[redirects]]
  from = "/v2"
  to = "/creative-direction-v2.html"
  status = 200

[[redirects]]
  from = "/v1"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/thank-you"
  to = "/thank-you-v3.html"
  status = 200

[[redirects]]
  from = "/round2-thank-you"
  to = "/round2-thank-you.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin"
